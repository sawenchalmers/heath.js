# Checks pull requests to main, and releases every merge to main as a container image (#40).
#
#   Pull request to main:  test → version check → build the image (not published)
#   Push to main (merge):  test → version check → build and publish the image → tag vX.Y.Z
#
# Publishing uses the run's own GITHUB_TOKEN, so no secrets are needed. The server pulls
# ghcr.io/sawenchalmers/heath.js:latest by itself; GitHub never connects to it.

name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only by default; the image job asks for more below.
permissions:
  contents: read

# One run per branch at a time. A newer push to a pull request cancels its older run.
# On main a running release always finishes, but only one more can wait: if several
# merges land while one runs, the newest waiting run replaces the older ones. Its image
# includes their changes, but their versions get no image or tag of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/sawenchalmers/heath.js

jobs:
  test:
    name: Test and check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all history and tags, for the version check

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run the tests
        run: npx vitest run

      # Fails unless package.json's version is above the latest vX.Y.Z tag (git and sort -V
      # compare versions numerically, so 0.10.0 > 0.9.0). Catches a forgotten bump on the pull
      # request, and keeps a merge from overwriting a published image or moving latest backwards.
      - name: Check the version was bumped
        run: |
          version=$(node -p "require('./package.json').version")
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          highest=$(printf '%s\n%s\n' "${latest#v}" "$version" | sort -V | tail -n1)
          if [ "v$version" = "$latest" ] || [ "$highest" != "$version" ]; then
            echo "::error::package.json version $version must be higher than $latest. Bump it with npm version patch (or minor)."
            exit 1
          fi
          echo "Version $version is higher than ${latest:-any release so far}."

  image:
    name: Build image${{ github.event_name == 'push' && ', publish and tag' || '' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the vX.Y.Z tag
      packages: write # publish to the GitHub Container Registry
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On pull requests this only proves the image builds; on main it also publishes it.
      # The labels link the package to this repository and record the commit it was built from.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the release
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "heath.js ${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
