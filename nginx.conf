# nginx inside the heath.js container image (see Dockerfile).
#
# It serves the built app and forwards the outside services the browser reaches
# through /proxy/, as the Vite dev server does in development (vite.config.ts). The
# list of services is in src/services/proxiedServices.ts; a test checks this file
# against it. The forwarding is needed because those services don't allow other websites to call
# them from a browser (no CORS headers); a server isn't bound by that rule.
#
# This is a template: the Dockerfile copies it to /etc/nginx/templates/, and when
# the container starts, nginx's image fills in ${NGINX_LOCAL_RESOLVERS} (the
# container's DNS servers) and writes the result to /etc/nginx/conf.d/default.conf.
#
# HTTPS and login are not handled here: on the server, the apps front page's web
# server sits in front of this container, handles certificates and single sign-on,
# and forwards /heath/ to it as plain HTTP on port 8080 (#40).

server {
    listen 8080; # unprivileged: ports below 1024 would need root
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't announce nginx's exact version in response headers and error pages.
    server_tokens off;

    # Redirects point to a path only (Location: /heath/), so they stay correct behind a
    # front server, where this container's own host and port aren't the browser's.
    absolute_redirect off;

    # The app is built for the path /heath/ (VITE_BASE_PATH in .env.production). Accept
    # requests with or without that prefix: a front server may strip it when forwarding
    # (/heath/x arrives as /x) or pass it on (/heath/x arrives as is), and the container
    # also works on its own at http://localhost:8080/heath/. A prefixed request is
    # handled as if the prefix weren't there.
    location = /heath {
        return 301 /heath/;
    }
    location /heath/ {
        rewrite ^/heath(/.*)$ $1 last;
    }

    # Compress text responses; the JavaScript bundle shrinks to about a third.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built JavaScript and CSS. Vite puts a hash of the content in each file name
    # (index-3f9a1c.js), so a file never changes under the same name and browsers
    # may keep it for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else: the file if it exists, otherwise index.html (the app's
    # start page), so the app itself decides what a path shows. index.html is
    # always revalidated, so a reload after a deployment picks up the new version.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── Outside services ──────────────────────────────────────────────────────
    # Their hostnames are looked up per request (through `resolver` and a variable
    # in proxy_pass), not once when nginx starts. So if a service or its DNS is
    # down, only requests to that service fail (502/504); nginx still starts and
    # the rest of the app works. Give up on an unreachable service after 5 s
    # rather than nginx's default of 60 s.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    resolver_timeout 5s;
    proxy_connect_timeout 5s;
    proxy_ssl_server_name on;

    # Check the outside services' HTTPS certificates against the image's trusted root
    # certificates, so a forged server can't feed us fake data (nginx accepts any
    # certificate by default). Depth 3 allows the usual chain of server certificate,
    # intermediate and root.
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;

    # Weather files (Weather tab).  /proxy/climate/x → https://climate.onebuilding.org/x
    location /proxy/climate/ {
        set $climate_host climate.onebuilding.org;
        rewrite ^/proxy/climate/(.*)$ /$1 break;
        proxy_pass https://$climate_host;
    }

    # EPSM construction options and embodied carbon (EPSMService).
    # /proxy/epsm/x → https://epsm.chalmers.se/x
    location /proxy/epsm/ {
        set $epsm_host epsm.chalmers.se;
        rewrite ^/proxy/epsm/(.*)$ /$1 break;
        proxy_pass https://$epsm_host;
    }

    # Any other /proxy/ path, including the simulation engine (/proxy/engine/, which the
    # browser calls as /heath/proxy/engine/): no engine is connected yet. Answer 503
    # with JSON rather than falling back to index.html. The engine runs on a separate
    # server; forwarding /proxy/engine/ to it, with its API key, is #59.
    # (/api/ is not handled here: on the server, /heath/api/ is Heath's own backend.)
    location /proxy/ {
        default_type application/json;
        return 503 '{"error":"unavailable","message":"The simulation server is not deployed here."}';
    }
}
